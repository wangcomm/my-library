<title>Marginalia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 淺灰畫布上只放封面，四種展示方式；選單收在右上角。配色固定為影片的淺灰黑白，不跟隨深色模式 */
:root {
  --bg: #ffffff;
  --surface: #f4f4f4;
  --surface-2: #e4e4e4;
  --ink: #222222;
  --muted: #707070;
  --line: #dcdcdc;
  --accent: #5f6a2c;
  --accent-ink: #f7f2e9;
  --accent-soft: #dde0bf;
  --gold: #7a5236;
  --danger: #9a4a33;
  --st-want: #8fadb9;
  --st-reading: #5f6a2c;
  --st-paused: #b3ad62;
  --st-dropped: #b9ab95;
  --st-done: #7a5236;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.07);
  --font-display: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-body: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-label: "Jost", "Century Gothic", "Avenir Next", sans-serif;
  --font-type: "Jost", "Century Gothic", "Avenir Next", sans-serif;
  --top-h: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1000px; margin: 0 auto; padding-block: 0 calc(32px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: 26px; letter-spacing: .02em; }
h2 { font-size: 17px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 14px; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* 按鈕 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 0 8px; }
.btn.danger { color: var(--danger); border-color: var(--line); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.block { width: 100%; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.back { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--accent); font-size: 15px; padding: 8px 0; min-height: 40px; }

/* 搜尋與篩選 */
.field-search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 15px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip { background: transparent; border-color: var(--ink); }
.chip .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }

/* 封面 */
.cover { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 0 1px 1px 0; overflow: hidden; box-shadow: var(--shadow); background: var(--cloth, #3d5a4c); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 9%; background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.08) 60%, rgba(0,0,0,.05)); pointer-events: none; }
.cover .ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 14% 12% 12% 18%; color: #2a2a2a; }
.cover { container-type: inline-size; outline: 1px solid rgba(0,0,0,.07); outline-offset: -1px; }
.cover .ph b { font-family: var(--font-display); font-size: 11px; font-size: clamp(6px, 8cqw, 15px); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; word-break: break-word; }
.cover .ph i { padding-right: 12%; font-style: normal; font-size: 9px; font-size: clamp(5px, 5.5cqw, 11px); opacity: .8; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cover .ph::before { content: ""; position: absolute; left: 18%; right: 12%; top: 9%; border-top: 1px solid rgba(0,0,0,.18); }
.rank-badge { position: absolute; bottom: 6px; right: 6px; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--gold); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; z-index: 1; }

/* 書格 */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 14px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 24px 18px; } }
.card { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 0; background: none; padding: 0; min-width: 0; }
.card .cover { margin-bottom: 6px; }
.card-title { font-weight: 500; font-size: 13.5px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-author { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.pbar > span { display: block; height: 100%; background: var(--st-reading); border-radius: 2px; }

.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.s-want { --c: var(--st-want); } .s-reading { --c: var(--st-reading); } .s-paused { --c: var(--st-paused); } .s-dropped { --c: var(--st-dropped); } .s-done { --c: var(--st-done); }

/* 正在讀 */
.now { display: flex; gap: 12px; overflow-x: auto; padding-block: 4px 18px; scrollbar-width: none; }
.now::-webkit-scrollbar { display: none; }
.now-item { flex: none; width: min(280px, 78vw); display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.now-item .cover { width: 52px; flex: none; }
.now-item .meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.now-item .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-label { font-size: 12px; letter-spacing: .12em; color: var(--muted); margin: 6px 0 8px; font-weight: 500; }

.empty { text-align: center; padding: 48px 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty .shelf { display: flex; gap: 6px; align-items: flex-end; height: 64px; }
.empty .shelf span { width: 14px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.empty h2 { color: var(--ink); }


/* 書籍頁：紙卡＋立體書封 */
.detail-hero.d-sheet { display: flex; flex-direction: column; align-items: stretch; gap: 26px; }
.d-book { position: relative; display: flex; justify-content: center; padding: 6px 0 18px; perspective: 1000px; }
.d-3d { --bw: min(56vw, 240px); position: relative; width: var(--bw); transform-style: preserve-3d; transform: translateX(8%) rotateY(30deg); }
.d-edge, .b3-edge { position: absolute; top: .6%; bottom: .6%; left: calc(var(--bw) * -.2); width: calc(var(--bw) * .2); transform-origin: right center; transform: rotateY(-90deg); background: linear-gradient(90deg, rgba(0,0,0,.14), transparent 18%, transparent 82%, rgba(0,0,0,.1)), repeating-linear-gradient(90deg, #f6f6f3 0 1.3px, #dcdcd7 1.3px 2px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
.d-back, .b3-back { position: absolute; inset: 0; transform: translateZ(calc(var(--bw) * -.2)); background: #d8d8d8; }
.d-3d .cover { z-index: 1; border-radius: 0; box-shadow: 0 2px 4px rgba(40,30,20,.18), 0 14px 30px rgba(40,30,20,.16); }
.d-3d .cover::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 7%; z-index: 2; background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.14) 55%, rgba(0,0,0,.08)); pointer-events: none; }
.d-floor { position: absolute; left: 50%; bottom: 4px; width: min(50vw, 220px); height: 18px; transform: translateX(-46%); background: radial-gradient(closest-side, rgba(0,0,0,.28), transparent); filter: blur(3px); }
.d-cards { display: flex; flex-direction: column; }
.paper { position: relative; background: var(--surface); border: 0; border-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,.05), 0 6px 16px rgba(0,0,0,.09); padding: 18px 20px; }
.d-cards .paper { animation: rise .55s cubic-bezier(.22,.8,.25,1) both; }
.d-cards .paper + .paper { margin-top: -6px; }
.d-cards .paper:nth-child(1) { z-index: 5; } .d-cards .paper:nth-child(2) { z-index: 6; animation-delay: 60ms; }
.d-cards .paper:nth-child(3) { z-index: 4; animation-delay: 120ms; } .d-cards .paper:nth-child(4) { z-index: 3; animation-delay: 180ms; }
.d-cards .paper:nth-child(5) { z-index: 2; animation-delay: 240ms; }
.p-title { padding: 20px 20px 18px; }
.d-sheet .p-title h1 { font-size: 24px; line-height: 1.3; }
.d-en { margin: 10px 0 0; text-align: right; font-family: var(--font-type); font-style: italic; font-weight: 300; font-size: 24px; line-height: 1.2; letter-spacing: .02em; }
.d-author { margin: 10px 0 0; font-size: 13.5px; color: var(--muted); }
.p-status { align-self: flex-start; display: inline-flex; align-items: baseline; gap: 10px; padding: 10px 22px 12px; margin-left: -4px; }
.p-status span { font-family: var(--font-type); font-style: italic; font-weight: 400; font-size: 21px; letter-spacing: .03em; }
.p-status small { font-family: var(--font-type); font-size: 13px; color: var(--muted); }
.p-blurb p { margin: 0; font-size: 14.5px; line-height: 1.85; }
.p-tags { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 18px; max-width: 100%; }
.oval { display: inline-block; padding: 4px 16px; border: 1.5px solid var(--ink); border-radius: 50%; font-size: 13px; line-height: 1.4; }
.p-quotes { padding: 20px 20px 64px; min-height: 140px; }
.d-quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.d-quotes li { position: relative; padding-right: 30px; }
.d-quotes p { margin: 0; font-size: 14.5px; line-height: 1.85; white-space: pre-wrap; }
.d-quotes .pg { font-family: var(--font-type); font-size: 12px; color: var(--muted); }
.d-quotes .x { position: absolute; top: -4px; right: -8px; width: 32px; height: 32px; border: 0; background: none; color: var(--muted); font-size: 18px; border-radius: 50%; }
.d-empty { margin: 0; color: var(--muted); font-size: 14px; }
.p-quotes .quote-form { margin-top: 14px; grid-template-columns: minmax(0, 1fr) auto; }
.p-quotes .quote-form[hidden] { display: none; }
.d-plus { position: absolute; right: 16px; bottom: 14px; width: 40px; height: 40px; border-radius: 50%; border: 1.5px dashed var(--muted); background: none; color: var(--ink); font-size: 20px; line-height: 1; display: grid; place-items: center; transition: transform .25s, border-color .25s; }
.d-plus[aria-expanded="true"] { transform: rotate(45deg); border-color: var(--ink); }
.d-more { margin-top: 18px; }
.d-more .panel.paper { border: 0; border-radius: 2px; margin-top: 12px; padding: 18px 20px; }
.d-h { font-family: var(--font-type); font-style: italic; font-weight: 400; font-size: 20px; letter-spacing: .03em; }
.d-more .status-pick .chip { font-family: var(--font-type); font-style: italic; font-weight: 400; font-size: 14.5px; }
@media (min-width: 760px) {
  .detail-hero.d-sheet { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
  .d-sheet .d-en { font-size: 34px; }
  .d-cards { order: 1; } .d-book { order: 2; position: sticky; top: 24px; padding-top: 30px; }
  .d-3d { --bw: min(34vw, 360px); }
  .d-floor { width: min(30vw, 300px); }
  .d-sheet .p-title h1 { font-size: 30px; }
  .d-more { max-width: calc(50% - 20px); }
}

/* 書籍頁浮層：背景是虛化的原畫面，書封固定，只有資料往上滑 */
body.d-open { overflow: hidden; }
body.d-open .app { filter: blur(14px) saturate(.85); transform: scale(1.03); pointer-events: none; user-select: none; transition: filter .45s, transform .45s; }
.d-layer { position: fixed; inset: 0; z-index: 20; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: color-mix(in srgb, var(--bg) 30%, transparent); }
.d-layer[hidden] { display: none; }
.d-inner { max-width: 1000px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.d-inner .top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 4; max-width: 1000px; margin: 0 auto; padding-inline: 16px; pointer-events: none; }
.d-inner .top > * { pointer-events: auto; }
.d-inner .back { background: var(--surface); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow); }
.d-inner .detail-hero.d-sheet { display: block; animation: none; }
.d-inner .d-book { position: fixed; z-index: 0; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 0; right: 0; padding: 0; pointer-events: none; }
.d-inner .d-floor { bottom: -14px; }
.d-inner .d-cards { position: relative; z-index: 2; margin-top: calc(64px + min(84vw, 360px) + 40px); }
.d-inner .d-more { position: relative; z-index: 2; }
@media (min-width: 760px) {
  .d-inner .d-book { left: 50%; right: auto; width: min(50vw, 500px); top: 110px; }
  .d-inner .d-cards { margin-top: 80px; max-width: calc(50% - 20px); }
}

/* 紙卡在深色底上維持米白紙色 */
.paper { --bg: #fafafa; --surface: #fafafa; --surface-2: #e8e8e8; --ink: #222222; --muted: #707070; --line: #d2d2d2; --accent: #5f6a2c; --accent-ink: #f7f2e9; --accent-soft: #dde0bf; --danger: #9a4a33; --gold: #7a5236; --st-reading: #5f6a2c; color: var(--ink); }
/* 紙卡錯落擺放、稍微傾斜 */
.d-cards { padding-left: 14px; padding-right: 4px; }
.d-cards .paper { translate: var(--dx, 0) 0; rotate: var(--rot, 0deg); }
.d-cards .p-title { --rot: -1.2deg; --dx: 6px; }
.d-cards .p-status { --rot: 2deg; --dx: -10px; }
.d-cards .p-blurb { --rot: .8deg; --dx: 14px; }
.d-cards .p-tags { --rot: -2.2deg; --dx: 2px; }
.d-cards .p-quotes { --rot: -.6deg; --dx: 10px; }
.d-more .panel.paper:nth-child(odd) { rotate: .6deg; translate: 8px 0; }
.d-more .panel.paper:nth-child(even) { rotate: -.5deg; translate: 14px 0; }
@media (min-width: 760px) { .d-inner .d-cards, .d-inner .d-more { margin-left: 48px; } .d-inner .d-cards { max-width: calc(50% - 60px); } .d-inner .d-more { max-width: calc(50% - 60px); } }

/* 新增：拍封面 */
.add-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.pick-btn { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 22px 18px 18px; min-height: 168px; justify-content: flex-end; border: 1px solid var(--ink); border-radius: 2px; background: var(--surface); cursor: pointer; }
.pick-btn.main { background: var(--ink); color: var(--bg); }
.pick-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.pick-btn .pi { margin-bottom: auto; }
.pick-btn b { font-size: 18px; }
.pick-btn small { font-size: 12.5px; opacity: .7; }
.add-manual { margin-top: 16px; }
.crop-hint { margin: 0 0 12px; }
.crop-wrap { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.crop-wrap img { display: block; max-width: 100%; max-height: 62vh; width: auto; height: auto; }
.crop-poly { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.crop-poly polygon { fill: rgba(95,106,44,.16); stroke: var(--accent); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.crop-h { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; cursor: grab; touch-action: none; }
.crop-h::after { content: ''; position: absolute; inset: 13px; border-radius: 50%; background: #fff; border: 2.5px solid var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.35); transition: transform .15s; }
.crop-h.on::after { transform: scale(1.35); }

/* 書脊照片 */
.dot-c, .dot-s { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); background: #fff; margin: 0 4px -1px 0; }
.dot-s { border-color: #8a5a3c; }
.crop-poly polygon.sp { fill: rgba(138,90,60,.16); stroke: #8a5a3c; }
.crop-h.sp::after { border-color: #8a5a3c; }
.d-3d::before { display: none !important; }
.d-spine { position: absolute; top: 0; left: 100%; height: 100%; width: calc(var(--bw) * .2); transform-origin: left center; transform: rotateY(90deg); background-size: 100% 100%; filter: brightness(.9); }
/* 詳情 */
.detail-hero { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (min-width: 640px) { .detail-hero { grid-template-columns: 180px minmax(0, 1fr); gap: 28px; } }
.detail-hero h1 { font-size: 22px; line-height: 1.35; }
@media (min-width: 640px) { .detail-hero h1 { font-size: 28px; } }
.en { color: var(--muted); font-size: 14px; margin: 4px 0 0; font-style: italic; }
.author { margin: 8px 0 0; font-size: 14px; }
.blurb { margin: 12px 0 0; font-family: var(--font-display); font-size: 15px; line-height: 1.7; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { font-size: 12px; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--ink); color: var(--ink); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.kv div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; }
.status-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.status-pick .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.progress-row { display: flex; align-items: center; gap: 12px; }
.progress-row .pbar { flex: 1; height: 8px; border-radius: 4px; }
.pct { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 44px; text-align: right; }
.page-input { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.page-input input { width: 88px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.quote { position: relative; padding: 12px 40px 12px 16px; border-left: 3px solid var(--gold); background: var(--bg); border-radius: 0 10px 10px 0; }

(() => {
const STATUS = [

// ---------- 儲存：IndexedDB（失敗時退回記憶體） ----------
const DB = {
  db: null, ok: false, mem: new Map(), memMeta: new Map(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('reading-library', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  },
  async all() { return this.ok ? this.tx('books', 'readonly', s => s.getAll()) : [...this.mem.values()]; },
  async put(b) { this.mem.set(b.id, b); if (this.ok) await this.tx('books', 'readwrite', s => s.put(b)); },
  async del(id) { this.mem.delete(id); if (this.ok) await this.tx('books', 'readwrite', s => s.delete(id)); },
  async getMeta(k) {
    if (!this.ok) return this.memMeta.get(k);
    const r = await this.tx('meta', 'readonly', s => s.get(k));
    return r && r.value;
  },
  async setMeta(k, v) { this.memMeta.set(k, v); if (this.ok) await this.tx('meta', 'readwrite', s => s.put({ key: k, value: v })); },
};

const S = {
  books: [], tags: [...DEFAULT_TAGS],
  tab: 'library', stack: [],
  filter: 'all', tagFilter: null, q: '', libView: 'stack', showMode: 'stack',

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const hasCJK = s => /[㐀-鿿豈-﫿]/.test(s);
const titleOf = b => b.titleZh || b.titleEn || '（未命名）';
const byId = id => S.books.find(b => b.id === id);
const fmtDate = d => d ? d.replace(/-/g, '/') : '—';

function progressOf(b) {
  if (b.status === 'done') return 100;
  if (b.totalPages > 0) return Math.max(0, Math.min(100, Math.round((b.currentPage || 0) / b.totalPages * 100)));
  return Math.max(0, Math.min(100, Math.round(b.progress || 0)));
}
function hashColor(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return CLOTH[h % CLOTH.length]; }

function coverHTML(b, badge = false) {
  const src = b.coverData || b.coverUrl;
  return `<div class="cover" style="--cloth:${hashColor(titleOf(b))}">
    <div class="ph"><b>${esc(titleOf(b))}</b><i>${esc(b.author || '')}</i></div>
    ${src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}
    ${badge && rankOf(b) ? `<span class="rank-badge">#${rankOf(b)}</span>` : ''}
  </div>`;
}
// 圖片載不到時移除，露出布面封面
document.addEventListener('error', e => { const t = e.target; if (t.tagName === 'IMG' && t.closest('.cover')) t.remove(); }, true);

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

async function save(b) {
  b.updatedAt = new Date().toISOString();
  rankCache = null;
  const i = S.books.findIndex(x => x.id === b.id);
  if (i >= 0) S.books[i] = b; else S.books.push(b);
  try { await DB.put(b); } catch (e) { toast('儲存失敗，請先匯出備份'); }
  Sync.schedule();
}

function newBook(p = {}) {
  return {
    id: uid(), coverUrl: '', coverData: '', spineData: '', spineRatio: 0, titleZh: '', titleEn: '', author: '', blurb: '',
    status: 'want', tags: [], quotes: [], notes: '', rating: null,
    startDate: '', endDate: '', currentPage: null, totalPages: null, progress: 0,
    createdAt: new Date().toISOString(), updatedAt: '', ...p,

}

// ---------- 排名：依評分自動計算（同分時較晚讀完的在前） ----------
function ranked() {
  return S.books.filter(b => b.rating > 0).sort((a, b) =>
    b.rating - a.rating || (b.endDate || '').localeCompare(a.endDate || '') || titleOf(a).localeCompare(titleOf(b), 'zh-Hant'));
}
let rankCache = null;
function rankOf(b) {
  if (!rankCache) rankCache = new Map(ranked().map((x, i) => [x.id, i + 1]));
  return rankCache.get(b.id) || null;
}
const fmtScore = r => (r % 1 ? r.toFixed(1) : String(r));

// 狀態連動：開始讀自動填開始日、讀完自動填讀完日
function applyStatus(b, st) {
  b.status = st;
  if ((st === 'reading' || st === 'done') && !b.startDate) b.startDate = today();
  if (st === 'done') { if (!b.endDate) b.endDate = today(); if (b.totalPages) b.currentPage = b.totalPages; b.progress = 100; }
}

// ---------- 導覽 ----------
const current = () => S.stack[S.stack.length - 1] || { name: S.tab };
// 換頁動畫：支援 View Transitions 的瀏覽器會讓封面從原位置放大到書的頁面，其餘頁面淡入滑動
function transition(update, dir = 'forward', fromCover = null, bookId = null) {
  const done = () => { update(); window.scrollTo(0, 0); };
  if (reduceMotion()) { done(); return; }
  if (!document.startViewTransition) {
    done();
    const m = $('#main');
    if (m.animate) m.animate([{ opacity: 0, transform: `translateX(${dir === 'back' ? -24 : 24}px)` }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.7,.2,1)' });
    return;
  }
  document.documentElement.dataset.dir = dir;
  if (fromCover) fromCover.style.viewTransitionName = 'book-cover';
  const t = document.startViewTransition(() => {
    if (fromCover) fromCover.style.viewTransitionName = '';
    done();
    const target = dir === 'back' ? findCover(bookId) : $('.detail-hero .cover');
    if (target && (fromCover || dir === 'back')) target.style.viewTransitionName = 'book-cover';
  });
  t.finished.finally(() => { document.querySelectorAll('.cover').forEach(c => { c.style.viewTransitionName = ''; }); });
}
function findCover(id) {
  if (!id) return null;
  const el = document.querySelector(`[data-book="${CSS.escape(id)}"] .cover`);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return r.bottom > 0 && r.top < innerHeight && getComputedStyle(el.closest('[data-book]')).visibility !== 'hidden' ? el : null;
}
function openBook(id, fromEl) {
  const cover = fromEl && (fromEl.classList.contains('cover') ? fromEl : fromEl.querySelector('.cover'));
  transition(() => { S.stack.push({ name: 'detail', id }); render(); }, 'forward', cover || null);
}
function go(view) { transition(() => { S.stack.push(view); render(); }); }
function back() {
  const v = current();
  transition(() => { S.stack.pop(); render(); }, 'back', null, v.name === 'detail' ? v.id : null);
}
function setTab(t) {
  Menu.close();
  if (t === S.tab && !S.stack.length) return;
  transition(() => { S.tab = t; S.stack = []; render(); });
}

function render() {
  const v = current();
  rankCache = null;
  const views = { library: vLibrary, detail: vDetail, edit: vEdit, add: vAdd, crop: vCrop, ranking: vRanking, settings: vSettings };
  const layer = $('#d-layer');
  if (v.name === 'detail') {
    // 書籍頁蓋在原本畫面上，底下的畫面虛化
    const base = S.stack[S.stack.length - 2] || { name: S.tab === 'add' ? 'library' : S.tab };
    const key = JSON.stringify(base);
    if (layer.hidden || layer.dataset.base !== key) {
      $('#main').innerHTML = views[base.name](base);
      if (base.name === 'library') renderGrid();
      if (base.name === 'ranking') mountRank();
      layer.dataset.base = key; layer.scrollTop = 0;
    }
    $('#d-inner').innerHTML = vDetail(v);
    layer.hidden = false; document.body.classList.add('d-open');
    fitDetail(); $('.d-inner .d-3d img')?.addEventListener('load', fitDetail);
    document.body.dataset.mode = '';
    $('#fab').hidden = true;
    return;
  }
  layer.hidden = true; layer.dataset.base = ''; $('#d-inner').innerHTML = ''; document.body.classList.remove('d-open');
  $('#main').innerHTML = views[v.name](v);
  document.body.dataset.mode = v.name === 'ranking' ? 'shelf' : '';
  $('#fab').hidden = !(v.name === 'library' || v.name === 'ranking') || !S.books.length;
  if (v.name === 'library') renderGrid();
  if (v.name === 'ranking') mountRank();
  if (v.name === 'crop') Crop.mount();
}

const usedTags = () => [...new Set([...S.tags, ...S.books.flatMap(b => b.tags)])].filter(t => S.books.some(b => b.tags.includes(t)));
function filtered() {
  const q = S.q.trim().toLowerCase();
  return S.books
    .filter(b => S.filter === 'all' || b.status === S.filter)
    .filter(b => !S.tagFilter || b.tags.includes(S.tagFilter))
    .filter(b => !q || [b.titleZh, b.titleEn, b.author].some(x => (x || '').toLowerCase().includes(q)))
    .sort((a, b) => (b.updatedAt || b.createdAt).localeCompare(a.updatedAt || a.createdAt));
}
function topbar(title, sub) {
  return `<header class="topbar"><div class="tb-title"><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>
    <button class="menu-btn" data-act="menu-open" aria-label="打開選單" aria-expanded="false"><span></span><span></span><span></span></button></header>`;
}
function filterLabel() {
  const parts = [];
  if (S.filter !== 'all') parts.push(STATUS_LABEL[S.filter]);
  if (S.tagFilter) parts.push(S.tagFilter);
  if (S.q.trim()) parts.push(`「${S.q.trim()}」`);
  return parts.join('・');
}
function vLibrary() {
  const count = k => S.books.filter(b => b.status === k).length;

  return `

    <button class="now-item" data-act="open" data-id="${b.id}">${coverHTML(b)}

// 書不多時，用沒有書名的空白書封把展示補滿（只是裝飾，點了沒反應，不會存進書庫）
// 手機版：詳細資訊從書的下緣開始，不壓到書
function fitDetail() {
  const bk = $('.d-inner .d-3d'), cards = $('.d-inner .d-cards'), layer = $('#d-layer');
  if (!bk || !cards) return;
  cards.style.marginTop = '';
  if (innerWidth >= 760) return;
  const cur = parseFloat(getComputedStyle(cards).marginTop) || 0;
  const want = bk.getBoundingClientRect().bottom + 30;
  cards.style.marginTop = Math.round(cur + want - (cards.getBoundingClientRect().top + layer.scrollTop)) + 'px';
}
addEventListener('resize', fitDetail);

function renderGrid() {
  const el = $('#lib-grid'); if (!el) return;
  const list = filtered();
  if (S.libView === 'stack' && list.length) {
    const fl = filterLabel();
    // 照加入的順序：最早加入的在最左邊
    const items = [...list].sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
    el.innerHTML = `<div class="show screen" id="show" tabindex="0" aria-label="封面展示：左右滑動瀏覽，點封面打開">
      <div class="show-stage" id="show-stage">${items.map((b, i) => deckBook(b, i)).join('')}</div>
      <div class="show-foot">${fl ? `<button data-act="clear-filter">${esc(fl)} ✕</button>` : '<span>滑動瀏覽</span>'}<span class="show-count" id="show-count"></span></div>
    </div>`;
    Show.mount(items, 'lib');
    return;
  }
  el.innerHTML = list.length ? `<div class="grid">${list.map((b, i) => `
    <button class="card" data-act="open" data-id="${b.id}" data-book="${b.id}" style="--i:${Math.min(i, 18)}">${coverHTML(b, true)}
      <span class="card-title">${esc(titleOf(b))}</span>
      <span class="card-author">${esc(b.author || '　')}</span>
      ${b.status === 'reading' ? `<span class="pbar"><span style="width:${progressOf(b)}%"></span></span>` : `<span class="status s-${b.status}">${STATUS_LABEL[b.status]}</span>`}
    </button>`).join('')}</div>` : `<p class="notice">沒有符合的書。</p>`;
}

// 讀進照片（最長邊 1600px），自動猜封面四個角
function loadPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);

    return { tags, list: all.filter(b => b.tags.includes(S.rankTag)), heading: S.rankTag || 'Category', key: 'tag:' + S.rankTag };
  }
  if (S.rankTab === 'year') {
    const years = [...new Set(S.books.filter(b => b.status === 'done' && b.endDate).map(b => b.endDate.slice(0, 4)))].sort().reverse();
    if (!S.rankYear || !years.includes(S.rankYear)) S.rankYear = years[0] || null;
    const inYear = S.books.filter(b => b.status === 'done' && S.rankYear && (b.endDate || '').startsWith(S.rankYear));
    return { years, inYear, list: all.filter(b => inYear.includes(b)), rest: inYear.filter(b => !(b.rating > 0)), heading: `Best of ${S.rankYear || ''}`, key: 'year:' + S.rankYear };

}

    S.showMode = m; DB.setMeta('showMode', m).catch(() => {});
    document.querySelectorAll('.pill[data-m]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
    const stage = $('#show-stage'); if (!stage) return;
    if (!reduceMotion()) { stage.classList.add('morph'); clearTimeout(this.morphTimer); this.morphTimer = setTimeout(() => stage.classList.remove('morph'), 950); }
    // 停在差不多同一本書
    this.draw(true);
    this.x = this.clamp(this.x / old * this.geo.step);
    this.draw();
  },
  geom(w, h, n) {
    const stack = S.showMode === 'stack', pad = 18;
    const s = stack ? Math.min(w * 0.4, 210, (h - 90) / 1.95) : Math.min(w * 0.3, 170, (h - 80) / 1.7);
    const step = stack ? s * 0.5 : s * 1.12;
    const total = (n - 1) * step + s * (stack ? 1.15 : 1);
    const room = w - pad * 2;
    return { stack, s, step, base: total <= room ? (w - total) / 2 : pad, max: Math.max(0, total - room) };
  },
  draw(measureOnly) {
    const stage = $('#show-stage'); if (!stage) return;
    const w = stage.clientWidth, h = stage.clientHeight, n = this.list.length;
    const g = this.geom(w, h, n);
    this.geo = g; this.x = this.clamp(this.x);
    stage.classList.toggle('is-stack', g.stack);
    stage.querySelectorAll('.gc').forEach((el, i) => {
      const left = g.base + i * g.step - this.x, cx = left + g.s / 2;
      // 疊起：一本接一本往右上方排，越後面越小一點
      const rel = Math.max(-0.7, Math.min(0.7, (cx - w / 2) / w));
      const y = g.stack ? h * 0.52 - rel * Math.min(h, w) * 0.3 : h * 0.47;
      const k = g.stack ? Math.min(1.04, 1 - 0.3 * rel) : 1;
      el.style.width = g.s + 'px';
      el.style.setProperty('--bw', g.s + 'px');
      el.style.transform = `translate3d(${left}px, ${y - g.s * 0.75}px, 0) scale(${k})`;
      el.style.zIndex = String(g.stack ? 1000 - i : 1);
      el.style.visibility = left > w + g.s || left < -g.s * 2 ? 'hidden' : 'visible';
    });
    const c = $('#show-count');
    if (c) c.textContent = `${String(n).padStart(2, '0')} 本`;
  },
};

// 本機 IndexedDB 是主要資料；每筆書用 updatedAt 比較，新的蓋舊的。刪除的書留下 deleted 標記，讓其他裝置也刪掉。
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';
const ts = s => Date.parse(s) || 0;
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
}
function authMsg(err) {
  const m = (err && err.message) || '';
  if (/invalid login credentials/i.test(m)) return 'Email 或密碼不對';
  if (/email not confirmed/i.test(m)) return '請先到信箱點確認信的連結';
  if (/already registered/i.test(m)) return '這個 Email 已經註冊過，請直接登入';
  if (/signups not allowed/i.test(m)) return '已關閉註冊，請用原本的帳號登入';
  if (/password/i.test(m)) return '密碼至少要 6 個字元';
  return '登入失敗：' + (m || '連線問題');
}
const Sync = {
  client: null, user: null, status: '', timer: null, busy: false, again: false,
  cfg() {
    const c = window.LIBRARY_CONFIG || {};
    return { url: S.sbUrl || c.supabaseUrl || '', key: S.sbKey || c.supabaseKey || '' };
  },
  async init() {
    const { url, key } = this.cfg();
    if (!url || !key) return false;
    try {
      if (!window.supabase) await loadScript(SUPABASE_JS);
      this.client = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'library-auth' } });
      const { data } = await this.client.auth.getSession();
      this.user = data && data.session ? data.session.user : null;
      this.client.auth.onAuthStateChange((_e, session) => { this.user = session ? session.user : null; });
      return true;
    } catch (e) {
      this.client = null; this.status = '同步功能載入失敗，請檢查網路或連線設定';
      return false;
    }
  },
  setStatus(s) { this.status = s; const el = $('#sync-status'); if (el) el.textContent = s; },
  schedule() {
    if (!this.client || !this.user) return;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 1500);
  },
  async run() {
    if (!this.client || !this.user) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setStatus('同步中…');
    try {
      const { data: remote, error } = await this.client.from('books').select('id,updated_at');
      if (error) throw error;
      const local = await DB.all();
      const lmap = new Map(local.map(b => [b.id, b]));
      const rmap = new Map(remote.map(r => [r.id, r]));
      const pull = remote.filter(r => !lmap.has(r.id) || ts(r.updated_at) > ts(lmap.get(r.id).updatedAt)).map(r => r.id);
      const push = local.filter(l => !l.demo && (!rmap.has(l.id) || ts(l.updatedAt) > ts(rmap.get(l.id).updated_at)));
      for (let i = 0; i < pull.length; i += 50) {
        const { data, error } = await this.client.from('books').select('id,data').in('id', pull.slice(i, i + 50));
        if (error) throw error;
        for (const row of data) if (row.data && row.data.id) await DB.put(row.data);
      }
      for (let i = 0; i < push.length; i += 20) {
        const rows = push.slice(i, i + 20).map(b => {
          if (!b.updatedAt) b.updatedAt = new Date().toISOString();
          return { id: b.id, data: b, updated_at: b.updatedAt, deleted: !!b.deleted };
        });
        const { error } = await this.client.from('books').upsert(rows);
        if (error) throw error;
      }
      if (pull.length) {
        S.books = (await DB.all()).filter(b => !b.deleted).map(b => newBook(b));
        rankCache = null;
        // 正在打字的畫面不重畫，避免打斷輸入
        const v = current().name, typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
        if (v !== 'edit' && !typing) render();
      }
      const d = new Date();
      this.setStatus(`已同步・${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`);
    } catch (e) {
      this.setStatus('同步失敗（' + ((e && e.message) || '連線問題') + '），資料仍保留在這台裝置，稍後會再試');
    }
    this.busy = false;
    if (this.again) { this.again = false; this.run(); }
  },
};

// ---------- Kobo 匯入（讀取閱讀器裡的 KoboReader.sqlite） ----------
const SQLJS = 'https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-asm-memory-growth.js';
function sqlRows(db, sql) {
  const r = db.exec(sql); if (!r.length) return [];
  const { columns, values } = r[0];
  return values.map(v => Object.fromEntries(columns.map((c, i) => [c, v[i]])));
}
async function importKobo(file) {
  toast('正在讀取 Kobo 資料…');
  let books, marks = [];
  try {
    if (!window.initSqlJs) await loadScript(SQLJS);
    const SQL = await window.initSqlJs();
    const db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
    let cols;
    try { cols = new Set(sqlRows(db, 'PRAGMA table_info(content)').map(r => r.name)); } catch (e) { cols = new Set(); }
    if (!cols.has('ContentID') || !cols.has('Title') || !cols.has('ContentType')) { db.close(); toast('這個檔案不是 Kobo 的資料庫，請選 KoboReader.sqlite'); return; }
    const col = (c, alias = c) => (cols.has(c) ? `${c} AS ${alias}` : `NULL AS ${alias}`);
    books = sqlRows(db, `SELECT ContentID AS id, Title AS title, ${col('Attribution', 'author')}, ${col('___PercentRead', 'pct')}, ${col('ReadStatus', 'rs')},
      ${col('DateLastRead', 'lastRead')}, ${col('LastTimeStartedReading', 'started')}, ${col('LastTimeFinishedReading', 'finished')}
      FROM content WHERE ContentType = 6 AND Title IS NOT NULL AND TRIM(Title) != ''`);
    try { marks = sqlRows(db, "SELECT VolumeID AS vid, Text AS text, Annotation AS note FROM Bookmark WHERE Text IS NOT NULL AND TRIM(Text) != '' ORDER BY DateCreated"); } catch (e) { marks = []; }
    db.close();
  } catch (e) {
    toast('讀取失敗：需要網路下載讀取工具，或檔案已損壞'); return;
  }
  const day = v => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : '');
  const norm = t => String(t || '').trim().toLowerCase();
  let added = 0, updated = 0, quotes = 0;
  for (const k of books) {
    const status = k.rs === 2 ? 'done' : k.rs === 1 ? 'reading' : 'want';
    const pct = Math.max(0, Math.min(100, Math.round(+k.pct || 0)));
    let b = S.books.find(x => x.koboId === k.id) || S.books.find(x => !x.koboId && !x.demo && (norm(x.titleZh) === norm(k.title) || norm(x.titleEn) === norm(k.title)));
    const isNew = !b;
    if (isNew) b = newBook({ ...(hasCJK(k.title) ? { titleZh: k.title.trim() } : { titleEn: k.title.trim() }), author: (k.author || '').trim() });
    b.koboId = k.id;
    // Kobo 不知道「暫停中」「棄書」，這兩種狀態保留你自己的設定
    if (b.status !== 'paused' && b.status !== 'dropped') {
      if (status === 'done' || b.status !== 'done') b.status = status;
    }
    if (b.status !== 'done' && !b.totalPages && pct > (b.progress || 0)) b.progress = pct;
    if (!b.startDate) b.startDate = day(k.started) || (status !== 'want' ? day(k.lastRead) : '');
    if (b.status === 'done' && !b.endDate) b.endDate = day(k.finished) || day(k.lastRead);
    const have = new Set(b.quotes.map(q => norm(q.text).split('\n')[0]));
    for (const mk of marks.filter(x => x.vid === k.id)) {
      const text = String(mk.text).trim();
      if (have.has(norm(text))) continue;
      have.add(norm(text));
      b.quotes.push({ id: uid(), text: mk.note && String(mk.note).trim() ? `${text}\n（筆記：${String(mk.note).trim()}）` : text, page: '', from: 'kobo' });
      quotes++;
    }
    await save(b);
    if (isNew) added++; else updated++;
  }
  toast(`Kobo 匯入完成：新增 ${added} 本、更新 ${updated} 本、${quotes} 句畫線`);
  render();
}

// ---------- 事件 ----------
const actions = {
  tab: el => setTab(el.dataset.tab),
  back: () => back(),
  open: el => openBook(el.dataset.id, el.closest('[data-book]') || el),
  filter: el => { S.filter = el.dataset.f; Show.x = 0; render(); Menu.refresh(); },
  edit: el => { S.draft = JSON.parse(JSON.stringify(byId(el.dataset.id))); go({ name: 'edit' }); },
  manual: () => { S.draft = newBook(); go({ name: 'edit' }); },
  'crop-auto': () => { S.crop.pts = initPts(S.crop.canvas); Crop.place(); },
  'crop-ok': () => {
    const c = S.crop, P = c.pts, out = warpCover(c.canvas, P.slice(0, 4));
    // 書脊：綠點右邊到咖啡色點那一塊，太窄就當作沒有書脊
    const px = (a, b) => Math.hypot((a[0] - b[0]) * c.canvas.width, (a[1] - b[1]) * c.canvas.height);
    const sw = (px(P[1], P[4]) + px(P[2], P[5])) / 2, cw = (px(P[0], P[1]) + px(P[3], P[2])) / 2;
    let spine = null;
    if (sw > cw * 0.03) spine = warpCover(c.canvas, [P[1], P[4], P[5], P[2]], 10);
    const img = { coverData: out.toDataURL('image/jpeg', 0.85),
      spineData: spine ? spine.toDataURL('image/jpeg', 0.85) : '', spineRatio: spine ? +(spine.width / out.width).toFixed(3) : 0 };
    const keep = c.keep;
    URL.revokeObjectURL(S.crop.url); S.crop = null;
    if (keep) { Object.assign(S.draft, img); S.stack.pop(); render(); window.scrollTo(0, 0); return; }
    S.draft = newBook(img);
    S.stack.pop(); S.stack.push({ name: 'edit' }); render(); window.scrollTo(0, 0);
  },

  'toggle-tag': el => { const t = el.dataset.tag; const tags = S.draft.tags; const i = tags.indexOf(t); if (i >= 0) tags.splice(i, 1); else tags.push(t); el.setAttribute('aria-pressed', i < 0); },
  'new-tag': async () => {
    const inp = $('#f-newtag'); const t = inp.value.trim(); if (!t) return;
    readForm();
    if (!S.tags.includes(t)) { S.tags.push(t); await DB.setMeta('tags', S.tags); }
    if (!S.draft.tags.includes(t)) S.draft.tags.push(t);
    render();
  },
  'cover-clear': () => { readForm(); S.draft.coverUrl = ''; S.draft.coverData = ''; S.draft.spineData = ''; S.draft.spineRatio = 0; render(); },
  'set-status': async el => { const b = byId(current().id); applyStatus(b, el.dataset.st); await save(b); render(); },
  'quote-new': el => {
    const f = $('#quote-form'); const open = f.hidden;
    f.hidden = !open; el.setAttribute('aria-expanded', String(open));
    if (open) $('#q-text').focus();
  },
  'quote-del': async el => { const b = byId(current().id); b.quotes = b.quotes.filter(q => q.id !== el.dataset.q); await save(b); render(); },
  delete: async el => {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = '再按一次確認刪除'; setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = '刪除這本書'; } }, 4000); return; }
    const b = byId(el.dataset.id);
    S.books = S.books.filter(x => x.id !== b.id);
    try { await DB.put({ id: b.id, deleted: true, updatedAt: new Date().toISOString() }); } catch (e) {}
    Sync.schedule();
    toast('已刪除'); back();
  },
  'menu-open': () => Menu.open(),
  'menu-close': () => Menu.close(),
  'clear-filter': () => { S.filter = 'all'; S.tagFilter = null; S.q = ''; Show.x = 0; render(); },
  'rating-clear': async () => { const b = byId(current().id); b.rating = null; await save(b); render(); },
  'lib-view': el => { S.libView = el.dataset.v; DB.setMeta('libView', S.libView).catch(() => {}); render(); Menu.refresh(); },
  'tag-filter': el => { S.tagFilter = S.tagFilter === el.dataset.tag ? null : el.dataset.tag; Show.x = 0; render(); Menu.refresh(); },
  'show-mode': el => Show.setMode(el.dataset.m),
  'kobo-help': () => { const h = $('#kobo-steps'); if (h) h.hidden = !h.hidden; },
  'sb-save': async () => {
    S.sbUrl = $('#sb-url').value.trim().replace(/\/+$/, ''); S.sbKey = $('#sb-key').value.trim();
    await DB.setMeta('sb', { url: S.sbUrl, key: S.sbKey });
    Sync.client = null; Sync.user = null; Sync.status = '';
    render();
    const ok = await Sync.init();
    toast(ok ? '已儲存，請登入' : '連線設定有誤，請檢查網址和 key');
    render();
  },
  'sb-signup': async () => {
    const email = $('#sb-email').value.trim(), password = $('#sb-pass').value;
    if (!email || password.length < 6) { toast('請填 Email 和至少 6 個字元的密碼'); return; }
    const { data, error } = await Sync.client.auth.signUp({ email, password });
    if (error) { toast(authMsg(error)); return; }
    if (data.session) { Sync.user = data.session.user; toast('註冊完成，開始同步'); await Sync.run(); render(); }
    else toast('已寄出確認信，點信中的連結後再回來登入');
  },
  'sb-logout': async () => { await Sync.client.auth.signOut(); Sync.user = null; Sync.status = ''; toast('已登出，書仍保留在這台裝置'); render(); },
  'sb-sync': () => Sync.run(),
  'rank-tab': el => { S.rankTab = el.dataset.t; render(); Menu.refresh(); },
  'rank-tag': el => { S.rankTag = el.dataset.tag; render(); Menu.refresh(); if (S.rankTab === 'tag') Menu.close(); },
  'rank-year': el => { S.rankYear = el.dataset.y; render(); Menu.refresh(); Menu.close(); },
  export: async () => {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename: `library-backup-${today()}.json`, data: exportJSON() }); toast('已匯出備份檔'); }
      catch (e) { if (e && e.code !== 'declined') toast('無法下載，請改用「複製備份內容」'); }
      return;
    }
    try {
      const blob = new Blob([exportJSON()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `我的書庫備份-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('已匯出備份檔');
    } catch (e) { toast('無法下載，請改用「複製備份內容」'); }
  },
  'copy-json': async () => {
    try { await navigator.clipboard.writeText(exportJSON()); toast('已複製，可貼到記事本保存'); }
    catch (e) { toast('無法複製，請改用匯出'); }
  },
  'tag-del': async el => { S.tags = S.tags.filter(t => t !== el.dataset.tag); await DB.setMeta('tags', S.tags); render(); },
  'tag-add': async () => { const t = $('#new-tag').value.trim(); if (t && !S.tags.includes(t)) { S.tags.push(t); await DB.setMeta('tags', S.tags); } render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  actions[el.dataset.act] && actions[el.dataset.act](el, e);
});

let notesTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'menu-q') { S.q = t.value; Show.x = 0; if (current().name === 'library') render(); }
  if (t.id === 'rating') {
    const v = +t.value, num = $('#score-num');
    t.style.setProperty('--p', `${(v - 1) / 9 * 100}%`);
    num.parentNode.style.setProperty('--t', v / 10);
    if (num.textContent !== fmtScore(v)) {
      num.textContent = fmtScore(v);
      if (!reduceMotion() && num.animate) num.animate([{ transform: 'scale(1.28) translateY(-4px)' }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.9,.3,1.3)' });
    }
  }
  if (t.id === 'notes') {
    const b = byId(current().id); $('#notes-saved').textContent = '編輯中…';
    clearTimeout(notesTimer);
    notesTimer = setTimeout(async () => { b.notes = t.value; await save(b); const s = $('#notes-saved'); if (s) s.textContent = '已儲存'; }, 600);
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'rating') {
    const b = byId(current().id); const before = rankOf(b);
    b.rating = +t.value; await save(b);
    const r = rankOf(b), note = $('#rank-note');
    if (note) note.textContent = `總榜第 ${r} 名`;
    if (r !== before) toast(before ? `排名 #${before} → #${r}` : `上榜！總榜第 ${r} 名`);
    const clear = document.querySelector('.rating-panel .hint'); if (clear) clear.remove();
  }
  if (t.id === 'pct-range') { const b = byId(current().id); b.progress = +t.value; if (b.progress > 0 && b.status === 'want') applyStatus(b, 'reading'); await save(b); render(); }
  if (t.id === 'cur-page') {
    const b = byId(current().id); b.currentPage = Math.max(0, Math.min(b.totalPages, parseInt(t.value, 10) || 0));
    if (b.currentPage > 0 && b.status === 'want') applyStatus(b, 'reading');
    if (b.currentPage >= b.totalPages) { applyStatus(b, 'done'); toast('恭喜讀完！'); }
    await save(b); render();
  }
  // 編輯頁換封面也走對準封面的步驟，才能拉平並切出書脊
  if ((t.id === 'snap-file' || t.id === 'snap-file2' || t.id === 'cover-file') && t.files[0]) {
    try {
      if (t.id === 'cover-file') readForm();
      const canvas = await loadPhoto(t.files[0]);
      const url = await new Promise(r => canvas.toBlob(b => r(URL.createObjectURL(b)), 'image/jpeg', 0.9));
      S.crop = { canvas, url, pts: initPts(canvas), keep: t.id === 'cover-file' };
      go({ name: 'crop' });
    } catch (err) { toast('這張照片讀不出來，請換一張'); }
    t.value = '';
  }
  if (t.id === 'kobo-file' && t.files[0]) { importKobo(t.files[0]); t.value = ''; }
  if (t.id === 'import-file' && t.files[0]) { importJSON(await t.files[0].text()); t.value = ''; }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'login-form') {
    const email = $('#sb-email').value.trim(), password = $('#sb-pass').value;
    const { data, error } = await Sync.client.auth.signInWithPassword({ email, password });
    if (error) { toast(authMsg(error)); return; }
    Sync.user = data.user; toast('登入成功，開始同步');
    render(); await Sync.run(); render();
  }
  if (f.id === 'quote-form') {
    const text = $('#q-text').value.trim(); if (!text) return;
    const b = byId(current().id);
    b.quotes.push({ id: uid(), text, page: $('#q-page').value.trim() });
    await save(b); render();
  }
  if (f.id === 'edit-form') {
    readForm();
    const b = S.draft; const err = $('#f-err');
    if (!b.titleZh && !b.titleEn) { err.textContent = '請至少填寫中文或英文書名。'; err.hidden = false; return; }
    if (b.status === 'done') applyStatus(b, 'done');
    else if (b.status === 'reading' && !b.startDate) b.startDate = today();
    const isNew = !byId(b.id);
    await save(b);
    S.draft = null;
    if (isNew) { S.tab = 'library'; S.stack = [{ name: 'detail', id: b.id }]; toast('已加入書庫'); render(); window.scrollTo(0, 0); }
    else { toast('已儲存'); back(); }
  }
});

(async () => {
  await DB.open();
  try {
    S.books = ((await DB.all()) || []).filter(b => !b.deleted).map(b => newBook(b));
    for (const b of S.books.filter(b => b.demo)) { try { await DB.del(b.id); } catch (e) {} }
    S.books = S.books.filter(b => !b.demo);
    S.tags = (await DB.getMeta('tags')) || [...DEFAULT_TAGS];
    S.libView = (await DB.getMeta('libView')) || 'stack';
    S.showMode = (await DB.getMeta('showMode')) || 'stack';
    if (!MODES.some(m => m.k === S.showMode)) S.showMode = 'stack';
    const sb = (await DB.getMeta('sb')) || {};
    S.sbUrl = sb.url || ''; S.sbKey = sb.key || '';
  } catch (e) { S.books = []; }
  render();
  if (await Sync.init()) {
    if (current().name === 'settings') render();
    Sync.run();
  }
})();
})();
</script>
